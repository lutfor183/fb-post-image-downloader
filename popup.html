<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: light dark; }
  body { font: 13px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; margin: 0; width: 320px; padding: 14px 16px; }
  h1 { font-size: 14px; margin: 0 0 8px; }
  #status { min-height: 3.2em; white-space: pre-wrap; }
  .hint { margin-top: 10px; font-size: 11px; opacity: .7; }
  .bar { height: 4px; border-radius: 2px; background: rgba(127,127,127,.25); overflow: hidden; margin: 10px 0 8px; }
  .bar > div { height: 100%; width: 0; background: #1877f2; transition: width .2s; }
</style>
</head>
<body>
<h1>Facebook post photos (HD PDF)</h1>
<div id="status">Starting…</div>
<div class="bar"><div id="fill"></div></div>
<div class="hint">Scans the post that is open in this tab, opens its photo viewer, and saves every photo into one PDF in your Downloads folder.</div>
<script src="popup.js"></script>
</body>
</html>
